server.port=8080
spring.application.name=BffOrquestador

# ── URLs de los microservicios (inyectadas en WebClientConfig - Factory Method) ──
microservicio.notas.url=http://localhost:8081
microservicio.asistencia.url=http://localhost:8082

# ── Timeouts del WebClient (Factory Method) ──
webclient.connect-timeout-ms=3000
webclient.read-timeout-ms=5000

# ── Resilience4j Circuit Breaker ────────────────────────────────────────────────
# Instancia para MS Notas
resilience4j.circuitbreaker.instances.msNotas.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.msNotas.sliding-window-size=5
resilience4j.circuitbreaker.instances.msNotas.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.msNotas.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.msNotas.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.msNotas.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.msNotas.register-health-indicator=true

# Instancia para MS Asistencia
resilience4j.circuitbreaker.instances.msAsistencia.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.msAsistencia.sliding-window-size=5
resilience4j.circuitbreaker.instances.msAsistencia.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.msAsistencia.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.msAsistencia.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.msAsistencia.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.msAsistencia.register-health-indicator=true

# ── Actuator — expone estado del Circuit Breaker en /actuator/health ────────────
management.endpoints.web.exposure.include=health,info,circuitbreakers
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# ── Swagger / OpenAPI ────────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── Logging ──────────────────────────────────────────────────────────────────────
logging.level.MIcroservicioB=DEBUG
logging.level.io.github.resilience4j=DEBUG
